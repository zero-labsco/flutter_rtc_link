name: CI

on:
  push:
    branches: ['v*.*.*']
    # Only trigger CI for core code changes, skip pure asset/non-package commits
    # Note: README*.md / CHANGELOG.md / docs/** and other user-facing docs are
    # intentionally NOT ignored — ignoring them would skip the entire ci.yml
    # workflow for docs-only PRs, leaving the branch-protection required checks
    # permanently pending and blocking merge. Docs-only PRs still trigger ci.yml
    # but the heavy jobs skip green via path-filter (code=false).
    paths-ignore:
      # Convention/agent docs (AGENTS.md, .codebuddy/**) are intentionally NOT ignored
      # so docs-only PRs still run CI and satisfy branch protection's required checks.
      - '.github/ISSUE_TEMPLATE/**'     # Issue/PR templates
      - '.github/workflows/stale.yml'          # Stale bot doesn't affect builds/publish
      - '.github/workflows/link-check.yml'     # Link checker doesn't affect builds/publish
      - '.github/workflows/dependabot-pr-bilingual.yml'  # PR body text injection doesn't affect builds/publish
      - '**.png'             # PNG images
      - '**.jpg'             # JPG images
      - '**.jpeg'            # JPEG images
      - '**.gif'             # GIF images
      - '**.webp'            # WebP images
      - '**.svg'             # SVG vector files
      - '**.ico'             # Icon files
      - '**.txt'             # Text files
      - '**.gitignore'       # Git ignore files
      - 'LICENSE'            # License file
      - 'NOTICE'             # License notice file
      - '.metadata'          # Package metadata (non-critical for CI validation)
      - 'example/lib/main.dart'  # Example entry point (CI checks example lib/ separately)
      - 'example/test/**'    # Example tests (not part of core plugin validation)
      - 'example/ios/Flutter/**' # Flutter-generated iOS files
      - 'example/android/**'    # Example Android build artifacts
      - 'example/ios/Runner.xcodeproj/**' # Xcode project files (auto-generated)
  pull_request:
    branches: [main, 'v*.*.*']
    # Apply same ignore rules for PRs (see push block for the rationale)
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/stale.yml'
      - '.github/workflows/link-check.yml'
      - '.github/workflows/dependabot-pr-bilingual.yml'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.svg'
      - '**.ico'
      - '**.txt'
      - '**.gitignore'
      - 'LICENSE'
      - 'NOTICE'
      - '.metadata'
      - 'example/lib/main.dart'
      - 'example/test/**'
      - 'example/ios/Flutter/**'
      - 'example/android/**'
      - 'example/ios/Runner.xcodeproj/**'
  # Manual trigger for main branch
  workflow_dispatch:
  # Support being reused by other workflows (e.g. pub-publish.yml)
  workflow_call:

# Allow only keeping the latest run per branch, cancel older runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-path-filter: does this change touch files that affect the pub package / pana score?
  # If only docs, GitHub config, or assets changed, the heavy jobs skip and go green.
  path-filter:
    name: Path Filter
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # All doc/asset files (README*.md, CHANGELOG.md, docs/**, LICENSE, *.yml/*.yaml, *.txt, images, etc.)
            # are NOT listed here, so docs-only changes → code=false → required checks skip green (no pana).
            # Only when any code path below is also changed does code=true → run real Analyze/Test/Pana.
            code:
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'test/**'
              - 'example/lib/**'
              - 'example/pubspec.yaml'
              - 'example/pubspec.lock'
              - 'example/analysis_options.yaml'
              - '.github/workflows/ci.yml'

  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    needs: path-filter
    steps:
      - name: Disable autocrlf on runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf false

      - name: Checkout repository
        uses: actions/checkout@v7

      # Non-package changes (docs/config/assets only): exit green to satisfy required check
      - name: Skip on non-code changes
        if: ${{ needs.path-filter.outputs.code != 'true' }}
        run: |
          echo "No package-affecting files changed; skipping Analyze & Test."
          exit 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pin the exact Flutter/Dart version so `dart format` output is identical
          # across CI, publish, and the local dev environment.
          flutter-version: '3.47.5'
          cache: true

      - name: Normalize working tree to LF
        # `git add --renormalize` writes LF into the index per .gitattributes,
        # then `git checkout -f -- .` materializes that LF index onto disk.
        # Guarantees `dart format` (below) reads LF, so --set-exit-if-changed
        # is idempotent and does not fail. No external tool dependency.
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git add --renormalize .
          git checkout -f -- .

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'example/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Print Flutter version
        run: flutter --version

      # ========== Plugin itself / Plugin itself ==========

      - name: Install plugin dependencies
        run: flutter pub get

      # Self-healing formatting: format the tree first, then warn (never fail)
      # when the branch was not format-clean. The command MUST keep the same
      # scope and Flutter version as the local one (`dart format .`), or the
      # warning fires on code that looks clean locally.
      # 格式化自愈：先把工作树格式化，再在分支不规范时告警（绝不失败）。此处的
      # 命令必须与本地命令（`dart format .`）保持相同范围与 Flutter 版本，
      # 否则会在本地看着干净的代码上告警。
      - name: Format Dart code (self-healing)
        run: |
          dart format .
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::warning::Branch is not dart format-clean (Flutter 3.47.5 / Dart 3.13.4). Run 'dart format .' locally and commit the result. / 分支未按 dart format 规范格式化，请在本地运行 'dart format .' 并提交。"
          fi

      - name: Run static analysis on plugin
        run: flutter analyze lib/

      - name: Run plugin unit tests
        run: flutter test

      # Release version-string consistency (pubspec / podspec / README / CHANGELOG)
      - name: Check release version consistency
        run: dart run tool/check_release.dart

      # ========== Example app / Example app ==========

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      # Example formatting is covered by the root `dart format .` step above.
      # 示例的格式化已由上面根目录的 `dart format .` 覆盖。

      - name: Run static analysis on example
        working-directory: example
        run: flutter analyze lib/

  # ========== pub.dev score self-check (separate parallel job) ==========
  # Runs in parallel with analyze-and-test; only after analyze passes, to avoid wasting pana time on broken code
  pana-check:
    name: Pana Score Check
    runs-on: ubuntu-latest
    needs: [analyze-and-test, path-filter]
    steps:
      - name: Disable autocrlf on runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf false

      - name: Checkout repository
        uses: actions/checkout@v7

      # Non-package changes: exit green to skip slow pana (satisfies required check)
      - name: Skip on non-code changes
        if: ${{ needs.path-filter.outputs.code != 'true' }}
        run: |
          echo "No package-affecting files changed; skipping Pana Score Check."
          exit 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Keep in sync with the analyze-and-test job (flutter-version: '3.47.5').
          flutter-version: '3.47.5'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'example/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Run pana pub.dev score check
        run: |
          dart pub global activate pana
          # Run pana: --no-warning exits non-zero on warnings; disable set -e so we
          # can still parse and report the score afterward
          set +e
          dart pub global run pana --no-warning --json . > pana.json
          PANA_EXIT=$?
          set -e
          if [ $PANA_EXIT -ne 0 ]; then
            echo "::error::pana reported warnings/errors (exit code $PANA_EXIT)"
            cat pana.json
            exit 1
          fi
          # pana 0.22+ nests the score under the 'scores' object: scores.grantedPoints
          SCORE=$(python3 -c "import json; d=json.load(open('pana.json')); s=d.get('scores', d); print(s['grantedPoints'])")
          MAX=$(python3 -c "import json; d=json.load(open('pana.json')); s=d.get('scores', d); print(s['maxPoints'])")
          echo "pana score: $SCORE / $MAX"
          if [ "$SCORE" -lt 120 ]; then
            echo "::error::pana score ($SCORE/$MAX) is below the 120 threshold"
            exit 1
          fi
          echo "✅ pana score ($SCORE/$MAX) meets the 120 threshold"
