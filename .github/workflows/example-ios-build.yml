name: Example iOS Build (manual verification)

# Manual-only verification of the iOS native build (including the plugin's Swift code).
# This is NOT a required status check for branch protection.
#
# Why this exists:
#   The plugin CI (ci.yml) excludes ios/Classes/*.swift from its code trigger list, so Analyze & Test /
#   Pana never compile the plugin's native Swift. Swift errors (e.g. DPP API availability) only
#   surface in the host app's CI, forcing repeated version bumps.
#
# Usage:
#   On a fix/* branch → Actions → select this workflow → "Run workflow" (uses the current branch by default).
#   `flutter build ios --simulator` compiles both the example and the plugin's native Swift, reproducing
#   compile errors that only newer Xcode toolchains flag.

on:
  # Manual trigger only
  workflow_dispatch:

jobs:
  ios-sim-build:
    name: Build Example for iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Disable autocrlf on runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.safecrlf false

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Keep in sync with ci.yml so local vs CI results don't diverge due to toolchain drift
          flutter-version: '3.47.5'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install plugin dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example for iOS simulator
        # This compiles the example AND the plugin's native Swift
        # (ios/Classes/RtcLinkPlugin.swift), surfacing errors that only
        # newer Xcode toolchains flag.
        working-directory: example
        run: flutter build ios --simulator --no-codesign

      - name: Create iOS simulator archive
        # Package the simulator .app as a zip for cloud iOS simulators like Appetize
        # (Appetize requires the zip to contain the .app at its root).
        working-directory: example/build/ios/iphoneos
        run: |
          zip -r ../../../../flutter_rtc_link_example_simulator.zip Runner.app || true

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-build
          path: flutter_rtc_link_example_simulator.zip
