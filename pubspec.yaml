name: flutter_rtc_link
description: "Flutter plugin for real-time audio/video (WebRTC WHIP/WHEP + LiveKit) and IoT device management: publish, subscribe, live relay, robot teleoperation, provisioning and OTA."
version: 0.1.3
topics:
  - webrtc
  - rtc
  - streaming
  - iot
  - robot
homepage: https://github.com/zero-labsco/flutter_rtc_link
repository: https://github.com/zero-labsco/flutter_rtc_link
documentation: https://zero-labsco.github.io/flutter_rtc_link/
issue_tracker: https://github.com/zero-labsco/flutter_rtc_link/issues

license: MPL-2.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  flutter_ota: ^1.0.0
  flutter_webrtc: ^1.6.2+hotfix.4
  http: ^1.6.0
  livekit_client: ^2.13.1
  logging: ^1.3.0
  mqtt_client: ^10.13.0
  ndef_record: ^1.5.0
  nfc_manager: ^4.2.1
  nordic_dfu: ^8.1.0
  nsd: ^5.0.1
  # Capped at 12.x on purpose: 13.0.0 bumps its Android module to compileSdk 37,
  # which exceeds the default Flutter template's 36 and would force an AGP / Gradle
  # upgrade on consumers. Do NOT run `dart pub upgrade --major-versions permission_handler`
  # until the template's compileSdk reaches 37. (See CHANGELOG 0.1.2 / 0.1.3.)
  # 有意锁在 12.x：13.0.0 把其 Android 子模块升到 compileSdk 37，超过默认 Flutter 模板的 36，
  # 会迫使消费者升级 AGP / Gradle。在模板 compileSdk 升到 37 前，切勿对其执行
  # `dart pub upgrade --major-versions permission_handler`。（见 CHANGELOG 0.1.2 / 0.1.3。）
  permission_handler: ^12.0.0
  wifi_iot: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zerolabsco.rtc_link
        pluginClass: RtcLinkPlugin
      ios:
        pluginClass: RtcLinkPlugin
