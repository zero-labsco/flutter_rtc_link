name: flutter_rtc_link
description: "Flutter plugin for real-time audio/video (WebRTC WHIP/WHEP + LiveKit) and IoT device management: publish, subscribe, live relay, robot teleoperation, provisioning and OTA."
version: 0.1.2
topics:
  - webrtc
  - rtc
  - streaming
  - iot
  - robot
homepage: https://github.com/zero-labsco/flutter_rtc_link
repository: https://github.com/zero-labsco/flutter_rtc_link
documentation: https://zero-labsco.github.io/flutter_rtc_link/
issue_tracker: https://github.com/zero-labsco/flutter_rtc_link/issues

license: MPL-2.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  flutter_ota: ^1.0.0
  flutter_webrtc: ^1.6.2+hotfix.4
  http: ^1.6.0
  livekit_client: ^2.13.1
  logging: ^1.3.0
  mqtt_client: ^10.13.0
  ndef_record: ^1.5.0
  nfc_manager: ^4.2.1
  nordic_dfu: ^8.1.0
  nsd: ^5.0.1
  permission_handler: ^11.0.0
  wifi_iot: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zerolabsco.rtc_link
        pluginClass: RtcLinkPlugin
      ios:
        pluginClass: RtcLinkPlugin
